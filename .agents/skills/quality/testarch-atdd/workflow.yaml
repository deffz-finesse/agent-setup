# Test Architect workflow: testarch-atdd
name: testarch-atdd
# prettier-ignore
description: 'Generate red-phase acceptance test scaffolds using TDD cycle. Use when the user says "lets write acceptance tests" or "I want to do ATDD"'

# Critical variables from config
config_source: "{project-root}/_agent-workflows/_config/config.toml"
run_dir: "{run_dir}"
test_artifacts: "{run_dir}/05-testing"
date: system-generated

# Workflow components
installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"
template: "./atdd-checklist-template.md"

# Variables and inputs
variables:
  test_dir: "{project-root}/tests" # Root test directory
  target_slug: "{story_key}" # Stable story scope for persisted evidence

# Output configuration
default_output_file: "{test_artifacts}/atdd-checklist-{target_slug}.md"

# Required tools
required_tools:
  - read_file # Read story markdown, framework config
  - write_file # Create test files, checklist, factory stubs
  - create_directory # Create test directories
  - list_files # Find existing fixtures and helpers
  - search_repo # Search for similar test patterns

tags:
  - qa
  - atdd
  - test-architect
  - tdd
  - red-green-refactor

execution_hints:
  interactive: false # Minimize prompts
  autonomous: true # Proceed without user input unless blocked
  iterative: true
