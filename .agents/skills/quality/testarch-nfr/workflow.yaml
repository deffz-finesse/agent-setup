# Test Architect workflow: testarch-nfr
name: testarch-nfr
# prettier-ignore
description: 'Audit NFR evidence for performance, security, reliability, and maintainability. Use when implementation evidence exists and the user says "audit NFR evidence", "audit NFRs", or "evaluate non-functional requirements"'

# Critical variables from config
config_source: "{project-root}/_agent-workflows/_config/config.toml"
run_dir: "{run_dir}"
test_artifacts: "{run_dir}/05-testing"
date: system-generated

# Workflow components
installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"
template: "./nfr-report-template.md"

# Variables and inputs
variables:
  target_slug: "" # Required story, epic, or release scope
  # NFR category assessment (defaults to all categories)
  custom_nfr_categories: "" # Optional additional categories beyond standard (security, performance, reliability, maintainability)

# Output configuration
default_output_file: "{test_artifacts}/nfr-{target_slug}-assessment.md"

# Required tools
required_tools:
  - read_file # Read story, test results, metrics, logs, workflow artifacts
  - write_file # Create NFR evidence audit, gate YAML, evidence checklist
  - list_files # Discover test results, metrics, logs
  - search_repo # Find NFR-related tests and evidence
  - glob # Find result files matching patterns

tags:
  - qa
  - nfr
  - test-architect
  - performance
  - security
  - reliability

execution_hints:
  interactive: false # Minimize prompts
  autonomous: true # Proceed without user input unless blocked
  iterative: true
